<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oktako</title>
<meta name="description" content="Oktako — le site arrive. Écrivez-nous : contact@oktako.fr">
<style>
  :root { color-scheme: light dark; --encre: #1b1a17; --papier: #f6f1e7; --accent: #b5542a; }
  @media (prefers-color-scheme: dark) { :root { --encre: #ece6d8; --papier: #14110f; --accent: #e6a06a; } }
  html, body { margin: 0; height: 100%; background: var(--papier); color: var(--encre);
    font: 18px/1.5 Georgia, "Times New Roman", serif; }
  main { min-height: 100%; display: grid; place-content: center; text-align: center; padding: 2rem 1rem; }
  h1 { font-size: clamp(2.4rem, 8vw, 4.5rem); letter-spacing: .04em; margin: 0 0 .5rem; font-weight: normal; }
  p { margin: .4rem 0; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
  .pieuvre { font-size: 3rem; line-height: 1; margin-bottom: 1rem; }
</style>
</head>
<body>
<main>
  <div class="pieuvre" aria-hidden="true">&#x1F419;</div>
  <h1>Oktako</h1>
  <p>Le site arrive.</p>
  <p><a href="mailto:contact@oktako.fr">contact@oktako.fr</a></p>
</main>
</body>
</html>
